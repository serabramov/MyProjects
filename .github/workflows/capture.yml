name: Capture portfolio screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Capture live homepages
        run: |
          cat > /tmp/cap.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          from PIL import Image
          sites={'helper':'https://smefinancehelper.com','financepedia':'https://smefinancepedia.com','personal':'https://sergheiabramov.com'}
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  c=await b.new_context(viewport={"width":1404,"height":900},device_scale_factor=1)
                  pg=await c.new_page()
                  for k,u in sites.items():
                      r=await pg.goto(u,wait_until="networkidle",timeout=60000)
                      await pg.wait_for_timeout(3000)
                      print(k,r.status,pg.url)
                      assert r.status==200
                      await pg.screenshot(path=f"/tmp/{k}.png")
                  await b.close()
          asyncio.run(main())
          for k in sites:
              Image.open(f"/tmp/{k}.png").convert("RGB").resize((842,540),Image.LANCZOS).save(f"assets/{k}.webp","WEBP",quality=72,method=6)
          PY
          python /tmp/cap.py
      - name: Commit screenshots
        run: |
          git config user.name "Serghei Abramov"
          git config user.email "serabramov@users.noreply.github.com"
          git add assets/*.webp
          git commit -m "Replace portfolio screenshots with fresh live-site captures (842x540 WebP)"
          git push
